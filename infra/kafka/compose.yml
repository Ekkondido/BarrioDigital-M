version: '3.8'

services:
  # ================= ZOOKEEPER CLUSTER (3 NODOS) =================
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2181:2181"
    networks:
      - barriodigital-net

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2182:2182"
    networks:
      - barriodigital-net

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2183
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2183:2183"
    networks:
      - barriodigital-net

  # ================= KAFKA BROKERS (3 BROKERS) =================
  kafka1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka1
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - barriodigital-net

  kafka2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - barriodigital-net

  kafka3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka3
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    networks:
      - barriodigital-net

  # ================= KAFKA UI (PANEL WEB DE ADMINISTRACION) =================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "BarrioDigital-Kafka-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29093,kafka3:29094"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
    networks:
      - barriodigital-net

  # ================= INICIALIZADOR DE TOPICOS DEL CASO =================
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-init-topics
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Esperar a que Kafka esté listo
      echo 'Esperando que los brokers de Kafka inicien...'
      cub kafka-ready -b kafka1:29092 1 40

      echo 'Creando tópicos según especificación de caso...'
      # requests.events (3 particiones, 3 replicas, retención 7 días)
      kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic requests.events --partitions 3 --replication-factor 3 --config retention.ms=604800000 --config cleanup.policy=delete
      
      # audit.timeline (3 particiones, 3 replicas, compact,delete, retención 30 días)
      kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic audit.timeline --partitions 3 --replication-factor 3 --config retention.ms=2592000000 --config cleanup.policy=compact,delete
      
      # requests.events.DLT (3 particiones, 3 replicas, retención 14 días)
      kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic requests.events.DLT --partitions 3 --replication-factor 3 --config retention.ms=1209600000 --config cleanup.policy=delete

      echo '✓ Tópicos creados exitosamente en Kafka:'
      kafka-topics --bootstrap-server kafka1:29092 --list
      "
    networks:
      - barriodigital-net

networks:
  barriodigital-net:
    name: barriodigital-net
    driver: bridge
