services:
  # ================= RABBITMQ =================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"'
    volumes:
      - ./mq/rabbitmq_definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - barriodigital-net

  # ================= ZOOKEEPER & KAFKA (Optimizado para t3.small) =================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    ports:
      - "2181:2181"
    networks:
      - barriodigital-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    networks:
      - barriodigital-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "BarrioDigital-Local-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    networks:
      - barriodigital-net

  # ================= MICROSERVICIOS (Ajustados con SerialGC para t3.small) =================
  catalog-svc:
    build:
      context: ../ms-barriodigital-catalog
      dockerfile: Dockerfile
    container_name: catalog-svc
    volumes:
      - catalog-data:/app/data
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    ports:
      - "8082:8082"
    networks:
      - barriodigital-net

  requests-svc:
    build:
      context: ../ms-barriodigital-requests
      dockerfile: Dockerfile
    container_name: requests-svc
    depends_on:
      - rabbitmq
      - kafka
      - catalog-svc
    volumes:
      - requests-data:/app/data
    ports:
      - "8081:8081"
    environment:
      CATALOG_SERVICE_URL: http://catalog-svc:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  notify-svc:
    build:
      context: ../ms-barriodigital-notify
      dockerfile: Dockerfile
    container_name: notify-svc
    depends_on:
      - rabbitmq
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  report-svc:
    build:
      context: ../ms-barriodigital-report
      dockerfile: Dockerfile
    container_name: report-svc
    depends_on:
      - kafka
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  audit-svc:
    build:
      context: ../ms-barriodigital-audit
      dockerfile: Dockerfile
    container_name: audit-svc
    depends_on:
      - kafka
    volumes:
      - audit-data:/app/data
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  admin-mq-svc:
    build:
      context: ../ms-barriodigital-admin-mq
      dockerfile: Dockerfile
    container_name: admin-mq-svc
    depends_on:
      - rabbitmq
    ports:
      - "8086:8086"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx130m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  bff-svc:
    build:
      context: ../ms-barriodigital-bff
      dockerfile: Dockerfile
    container_name: bff-svc
    depends_on:
      - requests-svc
      - catalog-svc
      - report-svc
      - audit-svc
      - admin-mq-svc
    ports:
      - "8080:8080"
    environment:
      REQUESTS_SERVICE_URL: http://requests-svc:8081
      CATALOG_SERVICE_URL: http://catalog-svc:8082
      REPORT_SERVICE_URL: http://report-svc:8084
      AUDIT_SERVICE_URL: http://audit-svc:8085
      ADMIN_MQ_SERVICE_URL: http://admin-mq-svc:8086
      MOCK_JWT_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC"
    networks:
      - barriodigital-net

  frontend-svc:
    build:
      context: ../frontend-barriodigital
      dockerfile: Dockerfile
    container_name: frontend-svc
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - bff-svc
    networks:
      - barriodigital-net

networks:
  barriodigital-net:
    driver: bridge

volumes:
  requests-data:
  catalog-data:
  audit-data:
