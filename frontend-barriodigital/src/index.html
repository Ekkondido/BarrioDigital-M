<!doctype html>

<head>
  <meta charset="utf-8">
  <title>BarrioDigital - Gestión Barrial y Comunitaria</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Polyfill WebCrypto API for plain HTTP / IP addresses (Secure Context requirement)
    (function() {
      if (typeof window === 'undefined') return;
      if (!window.crypto) {
        window.crypto = {};
      }
      if (!window.crypto.getRandomValues) {
        window.crypto.getRandomValues = function(arr) {
          for (var i = 0; i < arr.length; i++) {
            arr[i] = Math.floor(Math.random() * 256);
          }
          return arr;
        };
      }
      if (!window.crypto.subtle) {
        function rightRotate(value, amount) {
          return (value >>> amount) | (value << (32 - amount));
        }
        function sha256(ascii) {
          var mathPow = Math.pow;
          var maxWord = mathPow(2, 32);
          var lengthProperty = 'length';
          var i, j;
          var words = [];
          var asciiBitLength = ascii[lengthProperty] * 8;
          var hash = [], k = [];
          var primeCounter = 0;
          var isComposite = {};
          for (var candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
              for (i = 0; i < 313; i += candidate) {
                isComposite[i] = candidate;
              }
              hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
              k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
            }
          }
          words = [];
          for (i = 0; i < ascii[lengthProperty]; i++) {
            words[i >> 2] |= ascii[i] << ((3 - i % 4) * 8);
          }
          words[asciiBitLength >> 5] |= 0x80 << (24 - asciiBitLength % 32);
          words[(((asciiBitLength + 64) >> 9) << 4) + 15] = asciiBitLength;
          for (j = 0; j < words[lengthProperty];) {
            var w = words.slice(j, j += 16);
            var oldHash = hash.slice(0);
            for (i = 0; i < 64; i++) {
              var i2 = i + j;
              var w15 = w[i - 15], w2 = w[i - 2];
              var a = hash[0], e = hash[4];
              var temp1 = hash[7]
                + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                + ((e & hash[5]) ^ ((~e) & hash[6]))
                + k[i]
                + (w[i] = (i < 16) ? w[i] : (
                    w[i - 16]
                    + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                    + w[i - 7]
                    + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                  ) | 0
                );
              var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
              hash = [(temp1 + temp2) | 0].concat(hash);
              hash[4] = (hash[4] + temp1) | 0;
              hash.pop();
            }
            for (i = 0; i < 8; i++) {
              hash[i] = (hash[i] + oldHash[i]) | 0;
            }
          }
          var buffer = new ArrayBuffer(32);
          var view = new DataView(buffer);
          for (i = 0; i < 8; i++) {
            view.setUint32(i * 4, hash[i], false);
          }
          return buffer;
        }

        window.crypto.subtle = {
          digest: function(algorithm, data) {
            var bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
            return Promise.resolve(sha256(bytes));
          },
          importKey: function() { return Promise.resolve({}); },
          exportKey: function() { return Promise.resolve(new ArrayBuffer(0)); },
          sign: function() { return Promise.resolve(new ArrayBuffer(0)); },
          verify: function() { return Promise.resolve(true); },
          generateKey: function() { return Promise.resolve({}); }
        };
      }
    })();
  </script>
